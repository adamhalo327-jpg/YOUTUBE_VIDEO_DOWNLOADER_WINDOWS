name: Build YouTube Downloader 2.0 EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v6

      - name: Skonfiguruj Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalacja zaleznosci
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Uruchom testy kodu
        run: python -m unittest discover -s tests -v

      - name: Pobierz oficjalne narzedzia Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force -Path vendor | Out-Null

          Invoke-WebRequest -Uri 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe' -OutFile 'vendor/yt-dlp.exe'
          Invoke-WebRequest -Uri 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/SHA2-256SUMS' -OutFile 'vendor/SHA2-256SUMS'
          $checksumLine = Get-Content 'vendor/SHA2-256SUMS' | Where-Object { $_ -match '\s+\*?yt-dlp\.exe$' } | Select-Object -First 1
          if (-not $checksumLine) { throw 'Nie znaleziono SHA256 dla yt-dlp.exe' }
          $expected = ($checksumLine.Trim() -split '\s+')[0].ToLower()
          $actual = (Get-FileHash 'vendor/yt-dlp.exe' -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw 'Suma SHA256 yt-dlp.exe nie zgadza sie' }
          & 'vendor/yt-dlp.exe' --version
          if ($LASTEXITCODE -ne 0) { throw 'yt-dlp.exe nie uruchamia sie' }

          Invoke-WebRequest -Uri 'https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip' -OutFile 'deno.zip'
          Expand-Archive -Path 'deno.zip' -DestinationPath 'deno-unpacked' -Force
          $deno = Get-ChildItem 'deno-unpacked' -Recurse -Filter 'deno.exe' | Select-Object -First 1
          if (-not $deno) { throw 'Brak deno.exe w paczce' }
          Copy-Item $deno.FullName 'vendor/deno.exe'
          & 'vendor/deno.exe' --version
          if ($LASTEXITCODE -ne 0) { throw 'deno.exe nie uruchamia sie' }

          Invoke-WebRequest -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip' -OutFile 'ffmpeg.zip'
          Expand-Archive -Path 'ffmpeg.zip' -DestinationPath 'ffmpeg-unpacked' -Force
          $ffmpeg = Get-ChildItem 'ffmpeg-unpacked' -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          $ffprobe = Get-ChildItem 'ffmpeg-unpacked' -Recurse -Filter 'ffprobe.exe' | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw 'Brakuje ffmpeg/ffprobe' }
          Copy-Item $ffmpeg.FullName 'vendor/ffmpeg.exe'
          Copy-Item $ffprobe.FullName 'vendor/ffprobe.exe'
          & 'vendor/ffmpeg.exe' -version
          if ($LASTEXITCODE -ne 0) { throw 'ffmpeg.exe nie uruchamia sie' }

      - name: Zbuduj program EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m PyInstaller --noconfirm --clean --windowed --onedir --collect-all customtkinter --name YOUTUBE_VIDEO_DOWNLOADER_2_0 app.py
          if ($LASTEXITCODE -ne 0) { throw 'Budowa EXE nie powiodla sie' }
          $output = 'dist/YOUTUBE_VIDEO_DOWNLOADER_2_0'
          if (-not (Test-Path "$output/YOUTUBE_VIDEO_DOWNLOADER_2_0.exe")) { throw 'Brak programu EXE' }
          Copy-Item 'vendor/*.exe' $output
          Copy-Item 'README_PL.md' "$output/INSTRUKCJA.txt"
          Get-ChildItem $output | Select-Object Name, Length

      - name: Publikuj artefakt EXE
        uses: actions/upload-artifact@v6
        with:
          name: YOUTUBE_VIDEO_DOWNLOADER_2_0_WINDOWS
          path: dist/YOUTUBE_VIDEO_DOWNLOADER_2_0/
          if-no-files-found: error
          retention-days: 30
